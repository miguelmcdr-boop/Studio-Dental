# CI/CD Pipeline para Studio Dental
# Ejecuta lint + test + build + architecture en cada PR y push a main
# F3-01 y F3-02 del MASTER_ROADMAP.md
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancela ejecuciones previas del mismo PR/branch si llega un nuevo commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint (oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar oxlint
        run: npm run lint

  test:
    name: 🧪 Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar suite de tests
        run: npm run test

  build:
    name: 🏗️ Build (Vite production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      - name: Verificar que se generó el bundle
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ El directorio dist/ no se generó"
            exit 1
          fi
          echo "✅ Bundle generado exitosamente"
          ls -lh dist/

  architecture:
    name: 🏛️ Arquitectura (Constitución)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar reglas arquitectónicas
        run: npm run validate:architecture

  e2e:
    name: Tests E2E (Playwright + Supabase staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    needs: [build]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Calcular versión de Playwright
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Caché de browsers de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Instalar browsers de Playwright (con deps del sistema)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar deps del sistema (si había cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Configurar .env de staging
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.E2E_SUPABASE_ANON_KEY }}
          VITE_USE_SUPABASE=true
          VITE_ENVIRONMENT=staging
          EOF
          echo "✅ .env configurado (valores ocultos)"

      - name: Ejecutar seed E2E en Supabase staging (no-crítico)
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️  E2E_DATABASE_URL no configurado: saltando seed"
            echo "    Los tests pueden fallar si los usuarios e2e_* no existen"
            exit 0
          fi
          sudo apt-get install -y postgresql-client
          if psql "$DATABASE_URL" -f supabase/seed-multiclinica-e2e.sql; then
            echo "✅ Seed E2E aplicado exitosamente"
          else
            echo "⚠️  Seed E2E falló (posible problema de IPv6/red)"
            echo "    Continuando con los tests — los usuarios E2E pueden ya existir"
            echo "    Si los tests fallan por usuarios faltantes, aplicar seed manualmente:"
            echo "    https://github.com/miguelmcdr-boop/Studio-Dental/blob/main/supabase/seed-multiclinica-e2e.sql"
            exit 0
          fi

      - name: Ejecutar tests E2E
        env:
          CI: true
        run: npm run test:e2e

      - name: Subir reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Subir screenshots y videos de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            e2e/test-results/
          retention-days: 7
